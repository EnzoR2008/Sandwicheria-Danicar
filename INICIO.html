<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sandwichería Danicar</title>
  <style>
    /* Reset básico */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background: #fdf6e3; /* blanco suave */
      color: #000;
      display: flex;
      min-height: 100vh;
    }

    /* Barra lateral */
nav {
  background: #fac107; /* mostaza */
  width: 240px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  padding: 40px 20px;
  gap: 25px;
  box-shadow: 5px 0 15px rgba(0,0,0,0.3);
}

nav h1 {
  font-size: 2.5em; /* título grande */
  font-weight: bold;
  text-transform: uppercase;
  text-shadow: 3px 3px 6px rgba(0,0,0,0.4);
  color: #000;
  margin-bottom: 30px;
}

nav a {
  text-decoration: none;
  color: #000;
  font-size: 1.3em; /* enlaces más chicos que el título */
  font-weight: bold;
  text-transform: uppercase;
  text-shadow: 1px 1px 3px rgba(255,255,255,0.5);
  transition: 0.3s;
}

nav a:hover {
  color: #fff;
  text-shadow: 2px 2px 6px rgba(0,0,0,0.7);
}

    /* Contenido principal */
    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      background: linear-gradient(120deg, #fffdf6, #e1e1de);
    }

    main h1 {
      font-size: 4em;
      color: #000;
      text-transform: uppercase;
      text-shadow: 6px 6px 10px rgba(0,0,0,0.3);
      line-height: 1.2;
    }

    main p {
      margin-top: 20px;
      font-size: 1.5em;
      color: #333;
      text-shadow: 2px 2px 5px rgba(0,0,0,0.2);
    }

    /* Responsive */
    @media (max-width: 768px) {
      body {
        flex-direction: column;
      }
      nav {
        flex-direction: row;
        justify-content: center;
        align-items: center;
        min-width: auto;
        padding: 20px;
        gap: 20px;
      }
      nav h1 {
        display: none; /* Oculta el título en pantallas chicas */
      }
      main h1 {
        font-size: 3em;
      }
      main p {
        font-size: 1.2em;
      }
    }
  </style>
</head>
<body>
  <nav>
    <h1>DANICAR</h1>
    <a href="INICIO.html">Inicio</a>
    <a href="MENU.html">Menú</a>
    <a href="CONTACTO.html">Contacto</a>
    <a href="UBICACIÓN.html">Ubicación</a>
  </nav>

  <main>
    <div>
      <h1>Sandwichería Danicar<br>Desde 1994</h1>
      <p>¡Los mejores sabores en un solo lugar!</p>
    </div>
  </main>
</body>
</html>

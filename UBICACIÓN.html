<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sandwichería Danicar</title>
  <style>
    /* Reset básico */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background: #fdf6e3; /* blanco suave */
      color: #000;
      display: flex;
      min-height: 100vh;
    }

/* Barra lateral */
nav {
  background: #fac107; /* mostaza */
  width: 240px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  padding: 40px 20px;
  gap: 25px;
  box-shadow: 5px 0 15px rgba(0,0,0,0.3);
}

nav h1 {
  font-size: 2.5em; /* título grande */
  font-weight: bold;
  text-transform: uppercase;
  text-shadow: 3px 3px 6px rgba(0,0,0,0.4);
  color: #000;
  margin-bottom: 30px;
}

nav a {
  text-decoration: none;
  color: #000;
  font-size: 1.3em; /* enlaces más chicos que el título */
  font-weight: bold;
  text-transform: uppercase;
  text-shadow: 1px 1px 3px rgba(255,255,255,0.5);
  transition: 0.3s;
}

nav a:hover {
  color: #fff;
  text-shadow: 2px 2px 6px rgba(0,0,0,0.7);
}
    /* Contenido principal */
    main {
      flex: 1;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
     background: linear-gradient(120deg, #fffdf6, #e1e1de);
    }

    main h2 {
      font-size: 3em;
      color: #000;
      text-transform: uppercase;
      text-shadow: 5px 5px 10px rgba(0,0,0,0.3);
      margin-bottom: 20px;
      text-align: center;
    }

    main p {
      font-size: 1.5em;
      color: #333;
      text-shadow: 2px 2px 5px rgba(0,0,0,0.2);
      margin-bottom: 30px;
      text-align: center;
    }

    /* Ubicación destacada */
    .ubicacion {
      background:#d9a600; 
      padding:30px; 
      border-radius:15px; 
      text-align:center; 
      box-shadow: 0 5px 15px rgba(0,0,0,0.3); 
      width: 100%;
      max-width: 700px;
    }

    .ubicacion h3 {
      font-size:2em; 
      color:#fff; 
      text-shadow:2px 2px 5px #000; 
      margin-bottom:15px;
    }

    .ubicacion p {
      font-size:1.2em; 
      color:#fff; 
      text-shadow:1px 1px 3px #000;
      margin-bottom:15px;
    }

    .ubicacion a {
      display:inline-block; 
      padding:10px 20px; 
      background:#fff; 
      color:#d9a600; 
      font-weight:bold; 
      border-radius:10px; 
      text-decoration:none; 
      box-shadow: 0 3px 6px rgba(0,0,0,0.2); 
      transition:0.3s;
    }

    .ubicacion a:hover {
      background:#f0e68c;
      color:#000;
    }

    /* Responsive */
    @media (max-width: 768px) {
      body {
        flex-direction: column;
      }
      nav {
        flex-direction: row;
        justify-content: center;
        min-width: auto;
        padding: 20px;
        gap: 20px;
        flex-wrap: wrap;
      }
      nav h1 {
        width: 100%;
        font-size: 2em;
      }
      main h2 {
        font-size: 2.5em;
      }
      main p {
        font-size: 1.2em;
      }
    }
  </style>
</head>
<body>

  <!-- Sidebar con título y botones -->
   <nav>

  </nav>


  <main>

  </main>

</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sandwichería Danicar</title>
  <style>
    /* Reset básico */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      display: flex;
      min-height: 100vh;
      background: #fffdf6; /* fondo blanco suave */
      color: #000;
    }

    /* Sidebar lateral */
    nav {
      background: #fac107; /* mostaza */
      width: 240px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 40px 20px;
      gap: 25px;
      box-shadow: 5px 0 15px rgba(0,0,0,0.3);
    }

    nav h1 {
      font-size: 2.5em; /* 👈 bien grande */
      font-weight: bold;
      text-transform: uppercase;
      text-shadow: 3px 3px 6px rgba(0,0,0,0.4);
      color: #000;
      margin-bottom: 30px;
    }

    nav a {
      text-decoration: none;
      color: #000;
      font-size: 1.3em; /* 👈 más chico que DANICAR */
      font-weight: bold;
      text-transform: uppercase;
      text-shadow: 1px 1px 3px rgba(255,255,255,0.5);
      transition: 0.3s;
    }

    nav a:hover {
      color: #fff;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.7);
    }

    /* Contenido principal */
    main {
      flex: 1;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 40px;
      background: linear-gradient(120deg, #fffdf6, #e1e1de);
    }

    section {
      background: #fff;
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    section h3 {
      margin-bottom: 20px;
      font-size: 2em;
      color: #fac107;
      text-shadow: 2px 2px 5px rgba(0,0,0,0.3);
    }

    section p {
      font-size: 1.2em;
      margin-bottom: 10px;
      color: #333;
    }

    section a {
      color: #fff;
      background: #000;
      padding: 10px 20px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    section a:hover {
      background: #fac107;
      color: #000;
    }

    /* Responsive */
    @media (max-width: 768px) {
      body {
        flex-direction: column;
      }
      nav {
        flex-direction: row;
        width: 100%;
        justify-content: space-around;
        padding: 20px;
        gap: 10px;
        align-items: center;
      }
      nav h1 {
        font-size: 1.8em; /* más chico en móvil */
        margin-bottom: 0;
      }
      nav a {
        font-size: 1em;
      }
    }
  </style>
</head>
<body>
  <nav>
    <h1>DANICAR</h1>
    <a href="INICIO.html">Inicio</a>
    <a href="MENU.html">Menú</a>
    <a href="CONTACTO.html">Contacto</a>
    <a href="UBICACIÓN.html">Ubicación</a>
  </nav>
  <main>
    <!-- Sección bienvenida -->
    <section>
      <h3>Bienvenidos a Sandwichería Danicar</h3>
      <p>Desde 1994, los mejores sabores en un solo lugar.</p>
    </section>

    <!-- Sección contacto -->
    <section id="contacto">
      <h3>Contáctanos</h3>
      <p>Teléfono: +54 9 261 271-8368</p>
      <p>Whatsapp: <a href="https://wa.me/542612718368" target="_blank">Enviar mensaje</a></p>
    </section>
  </main>
</body>
</html>
